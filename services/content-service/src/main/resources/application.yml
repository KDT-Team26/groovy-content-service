spring:
  application:
    name: content-service
  threads:
    virtual:
      enabled: true
  # Phase 7(DB per Service) 패턴 재사용: content_db를 이 서비스가 직접 소유한다. study_id/
  # author_id는 각각 study-service/identity-service 소속(다른 Bounded Context의 Aggregate)이라
  # 이 스키마에 FK를 걸지 않는다(calendar_db의 user_id/study_id와 동일한 이유).
  datasource:
    url: ${SPRING_DEV_DB_URL:jdbc:mysql://localhost:3306/content_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DEV_DB_USERNAME:content_service}
    password: ${SPRING_DEV_DB_PASSWORD:content_service_local_only_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ContentHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # MSA 전환: 이 서비스도 댓글/좋아요 알림을 Outbox+Kafka로 발행한다(notification-service가
  # 소비하는 "notification-events" 토픽에 함께 발행).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8083

# identity-service가 발급자다 — 이 서비스는 검증만 한다(study-service/calendar-service와
# 동일한 패턴). principal은 email이 아니라 uid 클레임(userId, Long)로 바로 채운다 — 이
# 서비스에는 User 테이블이 없다.
jwt:
  jwks-url: ${JWT_JWKS_URL:http://identity-service:8081/.well-known/jwks.json}
  jwks-connect-timeout-ms: ${JWT_JWKS_CONNECT_TIMEOUT_MS:2000}
  jwks-read-timeout-ms: ${JWT_JWKS_READ_TIMEOUT_MS:3000}
  jwks-cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS:300}

# groovy(레거시) SecurityConfig와 동일한 이유(프론트가 credentials: "include"로 직접 호출).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 스터디 멤버십 확인·요약 정보·"내 스터디 옵션" 조회·경험치 적립에 쓰는 study-service 주소
# (StudyServiceClient). groovy의 것과 동일한 계약이지만 이 서비스가 실제로 쓰는 4개
# 엔드포인트만 옮겼다.
study-service:
  url: ${STUDY_SERVICE_URL:http://study-service:8082}
  connect-timeout-ms: ${STUDY_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${STUDY_SERVICE_READ_TIMEOUT_MS:3000}

# 작성자/댓글 작성자 이름 배치 조회에 쓰는 identity-service 주소(UserServiceClient).
identity-service:
  url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
  connect-timeout-ms: ${IDENTITY_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${IDENTITY_SERVICE_READ_TIMEOUT_MS:3000}

# MSA 전환 Phase 12 패턴 재사용: 분산 트레이싱(TracingConfig 참고).
management:
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
